[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation-harness"
version = "0.1.0"
description = "Automated evaluation framework for RAG retrieval strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.2",
    "langchain-experimental>=0.0.49",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "rank_bm25>=0.2.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.66.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
