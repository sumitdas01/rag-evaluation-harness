name: RAG Evaluation Harness CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-evaluate:
    name: Unit Tests & Quality Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Unit Test Suite
      run: |
        pytest tests/ -v

    - name: Validate Index Construction
      run: |
        python -m src.ingestion.build_index --strategy simple --force

    - name: Execute Regression Quality Gate
      env:
        EVAL_THRESHOLD: "70.0"
      run: |
        # Verifies that benchmark accuracy meets or exceeds the required threshold
        python -m src.evaluation.quality_gate
